<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Blue Lotus Foods - Vendor Application</title>
    <link href="/src/tailwind.css" rel="stylesheet">
    <style>
      /* Prevent iOS auto-zoom on form focus */
      @media screen and (max-width: 1024px) {
        input, select, textarea { font-size: 16px !important; }
      }
      body {
        background-color: #f1f5f9;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        margin: 0;
      }
      label {
        color: #0A3D5C;
        padding: 5px;
        font-weight: bold;
      }
      input, select, option, textarea, .datepicker {
        background-color: white;
        color: #0A3D5C;
        border: 1px solid #0A3D5C;
        padding: 5px;
        border-radius: 4px;
        font-size: 1rem;
      }
      input::placeholder, textarea::placeholder {
        color: #0A3D5C;
        opacity: 0.7;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        background-color: #0A3D5C;
        color: white; /* Fix color for visibility */
        padding: 10px;
        text-align: left;
      }
      td {
        padding: 10px;
        border: 1px solid #e5e7eb;
        color: #1e293b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.tsx"></script>
  </body>
</html>
